upstream school_mgmt_upstream {
    server 127.0.0.1:3004;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name school-mgmt.dokiva.id;

    # Kuitansi maksimum 10 MB/file di aplikasi — beri sedikit kelonggaran
    client_max_body_size 15M;

    # Aset statis Next.js: cache panjang & immutable
    location /_next/static/ {
        proxy_pass http://school_mgmt_upstream;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://school_mgmt_upstream;
        proxy_http_version 1.1;

        # Dukungan upgrade (HMR dev / websocket bila ada)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Map untuk header Connection (taruh di http{} jika belum ada secara global).
# Aman didefinisikan sekali; jika nginx mengeluh "duplicate", hapus baris map ini.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}